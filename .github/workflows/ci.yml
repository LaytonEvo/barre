name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # Guards the accessibility promise in docs/02: if a token change drops a
      # pair below WCAG AA, this fails rather than shipping.
      - name: Contrast check
        run: npm run check:contrast

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders. Real values live in Vercel; these only need
          # to satisfy lib/env.ts so the build can complete.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key

  database:
    name: Migrations, invariants, RLS
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      # Applies every migration from scratch, then asserts the invariants in
      # docs/01-DATA-MODEL.md hold. That includes the two guarantees that cannot
      # be checked by reading the SQL: that a member cannot read another
      # member's health data (tested as a real authenticated role), and that 20
      # simultaneous bookings at a 10-space class produce exactly 10 bookings
      # (tested with genuinely parallel connections).
      - name: Database checks
        run: tests/db/run.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
