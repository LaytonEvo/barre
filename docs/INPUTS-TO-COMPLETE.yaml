# -----------------------------------------------------------------------------
# 7. QUICK YES / NO
# -----------------------------------------------------------------------------
decisions:
  # Auto no-show marking at +30 mins. If it carries a financial penalty it will
  # occasionally charge someone Kelly forgot to check in, with no way for them
  # to prove otherwise. My suggestion: the auto-mark creates a PENDING no-show
  # Kelly confirms with one tap (auto-confirming after 48h). Still no routine
  # admin, but a mistake is recoverable. Already built this way, easy to switch.
  no_show_requires_confirmation: TODO # true (my recommendation) / false

  sentry_error_monitoring: TODO # true / false — free tier
  separate_layton_admin_account: TODO # true / false — so the audit log tells you apart
  build_sms_behind_flag_at_m8: TODO # true / false

  # Mux charges per minute stored and streamed. M7 IS NOW BUILT on it — see
  # docs/03 section I1 for the cost shape and the alternatives. Nothing is spent
  # until an account exists and the keys are set, and the library says plainly
  # that it is unconfigured until then, so this is still a free decision.
  mux_confirmed: TODO # true / false / "price up Cloudflare Stream or Bunny instead"

  # Needed before any member can watch anything. Without these the pages work
  # and explain what is missing; with them the library is live.
  mux_keys_supplied: TODO # true / false — TOKEN_ID, TOKEN_SECRET, SIGNING_KEY_ID, SIGNING_KEY_PRIVATE, WEBHOOK_SECRET

  # Which products include the video library. All three are data, none are set.
  on_demand_only_subscription_price_pence: TODO # integer, or false if not offering one
  studio_membership_includes_on_demand: TODO # true / false
  pack_holders_get_video_access: TODO # true / false (currently false, my recommendation)

  # --- M8: email and growth -------------------------------------------------
  # BLOCKS LAUNCH. Without these nothing is emailed AT ALL, including booking
  # confirmations — a member who books gets silence and emails Kelly to ask.
  # Free tier is 3,000/month. Needs a verified sending domain (same DNS work as M9).
  resend_keys_supplied: TODO # true / false — RESEND_API_KEY and EMAIL_FROM

  # One variable: `openssl rand -hex 32`. Without it, win-backs and review requests
  # are SKIPPED (a marketing email needs a working unsubscribe link). Transactional
  # email is unaffected.
  email_link_secret_supplied: TODO # true / false

  # The "write a review" link from Kelly's Google Business Profile. Review requests
  # queue NOTHING until this is set. See docs/03 J3.
  google_review_url: TODO # the URL, or false to not ask for reviews

  # My thresholds, all settings. See docs/03 J4.
  win_back_after_days: TODO # 35 (mine) / a number Kelly prefers
  review_request_after_classes: TODO # 3 (mine) / a number
  voucher_validity_months: TODO # 18 (mine) / a number

  # I would leave SMS off for launch: it costs per message and UK marketing SMS
  # needs its own consent, which the email wording does not obviously cover.
  enable_sms_at_launch: TODO # false (my recommendation) / true

